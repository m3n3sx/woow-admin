<!DOCTYPE html>
<html>
<head>
    <title>Test Conditional Fields Visibility</title>
    <style>
        body { font-family: monospace; padding: 20px; }
        .test-section { margin: 20px 0; padding: 15px; border: 2px solid #ccc; }
        .woow-conditional { padding: 10px; margin: 10px 0; background: #f0f0f0; }
        .hidden { display: none !important; }
        input, select { margin: 5px; padding: 5px; }
    </style>
</head>
<body>
    <h1>🧪 Test: Conditional Fields Visibility</h1>
    
    <div class="test-section">
        <h2>Test 1: Background Type Selector</h2>
        <select id="bg-type" name="admin_menu[background_type]">
            <option value="solid">Solid Color</option>
            <option value="gradient">Gradient</option>
            <option value="glass">Glassmorphism</option>
        </select>
        
        <div class="woow-conditional" data-show-when="admin_menu[background_type]=solid" id="solid-field">
            <label>Background Color (Solid):</label>
            <input type="color" name="admin_menu[background_color]" value="#ff0000">
        </div>
        
        <div class="woow-conditional hidden" data-show-when="admin_menu[background_type]=gradient" id="gradient-field">
            <label>Gradient Start:</label>
            <input type="color" name="admin_menu[gradient_start]" value="#00ff00">
        </div>
        
        <div class="woow-conditional hidden" data-show-when="admin_menu[background_type]=glass" id="glass-field">
            <label>Glass Base Color:</label>
            <input type="color" name="admin_menu[glass_base_color]" value="#0000ff">
        </div>
    </div>
    
    <div class="test-section">
        <h2>Test Results:</h2>
        <div id="results"></div>
    </div>
    
    <script>
        const bgType = document.getElementById('bg-type');
        const solidField = document.getElementById('solid-field');
        const gradientField = document.getElementById('gradient-field');
        const glassField = document.getElementById('glass-field');
        const results = document.getElementById('results');
        
        function updateVisibility() {
            const value = bgType.value;
            
            // Hide all
            solidField.classList.add('hidden');
            gradientField.classList.add('hidden');
            glassField.classList.add('hidden');
            
            // Show selected
            if (value === 'solid') {
                solidField.classList.remove('hidden');
            } else if (value === 'gradient') {
                gradientField.classList.remove('hidden');
            } else if (value === 'glass') {
                glassField.classList.remove('hidden');
            }
            
            // Update results
            results.innerHTML = `
                <p><strong>Selected:</strong> ${value}</p>
                <p><strong>Solid visible:</strong> ${!solidField.classList.contains('hidden')}</p>
                <p><strong>Gradient visible:</strong> ${!gradientField.classList.contains('hidden')}</p>
                <p><strong>Glass visible:</strong> ${!glassField.classList.contains('hidden')}</p>
                <hr>
                <p><strong>Solid offsetParent:</strong> ${solidField.querySelector('input').offsetParent !== null}</p>
                <p><strong>Gradient offsetParent:</strong> ${gradientField.querySelector('input').offsetParent !== null}</p>
                <p><strong>Glass offsetParent:</strong> ${glassField.querySelector('input').offsetParent !== null}</p>
            `;
        }
        
        bgType.addEventListener('change', updateVisibility);
        updateVisibility();
    </script>
</body>
</html>
